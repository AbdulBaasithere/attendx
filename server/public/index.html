<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AttendX</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-800"><div id="app"></div>
<script>
const $=s=>document.querySelector(s); let T=localStorage.t, ME=null, TAB='dash';
const api=async(p,o={})=>{const h={Authorization:'Bearer '+T};let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
 const r=await fetch('/api'+p,{method:o.method||(b?'POST':'GET'),headers:h,body:b});if(o.blob)return r.blob();const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?String(d).slice(0,10):'';const ft=d=>d?new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'–';
const inp='border rounded px-2 py-1 text-sm',btn='bg-indigo-600 hover:bg-indigo-700 text-white rounded px-3 py-1 text-sm',ghost='border rounded px-3 py-1 text-sm hover:bg-slate-50';
const toast=m=>{const e=document.createElement('div');e.className='fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-2 rounded shadow';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3500)};
const act=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
const table=(cols,rows)=>`<div class="overflow-x-auto bg-white rounded shadow"><table class="w-full text-sm"><thead class="bg-slate-50 text-left">${cols.map(c=>`<th class="p-2">${c[0]}</th>`).join('')}</thead><tbody>${rows.map(r=>`<tr class="border-t">${cols.map(c=>`<td class="p-2">${c[1](r)}</td>`).join('')}</tr>`).join('')||'<tr><td class="p-3 text-slate-400">No records</td></tr>'}</tbody></table></div>`;
const R=()=>ME.role, isHR=()=>['hr','super_admin'].includes(R());
const TABS=()=>{const r=R(),t=[['dash','Dashboard']];if(!['it_admin','payroll_officer'].includes(r))t.push(['att','My Attendance'],['corr',r==='employee'?'Requests':'Approvals'],['leave','Leaves'],['ot','Overtime']);
 if(['hr','super_admin','manager','payroll_officer'].includes(r))t.push(['analytics','Analytics']);if(isHR())t.push(['anom','Exceptions'],['setup','Setup']);if(isHR()||r==='it_admin')t.push(['import','Import']);
 if(['hr','super_admin','payroll_officer'].includes(r))t.push(['pay',r==='payroll_officer'?'Payroll':'Closure & payroll']);if(r!=='employee')t.push(['users',r==='manager'?'Team':'People']);if(['super_admin','it_admin'].includes(r))t.push(['audit','Audit']);return t};
function loginView(){$('#app').innerHTML=`<div class="min-h-screen grid place-items-center"><form id=f class="bg-white p-8 rounded-xl shadow w-80 space-y-3"><h1 class="text-2xl font-bold">AttendX</h1><p class="text-sm text-slate-500">Paperless attendance & payroll</p>
<input name=email class="${inp} w-full" placeholder="Email" value="hr@demo.com"><input name=password type=password class="${inp} w-full" placeholder="Password" value="Passw0rd!"><button class="${btn} w-full">Sign in</button>
<p class="text-xs text-slate-400">Demo: admin@ hr@ manager@ emp1@ it@ demo.com</p></form></div>`;
 $('#f').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/login',{body:{email:f.get('email'),password:f.get('password')}});T=r.token;localStorage.t=T;boot()})}
async function boot(){try{ME=await api('/me')}catch{return loginView()};shell()}
async function shell(){const n=(await api('/notifications')).filter(x=>!x.read);
 $('#app').innerHTML=`<div class="flex flex-col md:flex-row min-h-screen"><aside class="md:w-56 bg-slate-900 text-slate-200 p-4 space-y-1"><div class="text-white font-bold text-lg mb-2">AttendX</div><div class="text-xs mb-3">${esc(ME.full_name)}<br><span class="uppercase text-indigo-300">${ME.role.replace('_',' ')}</span></div>
 ${TABS().map(t=>`<button data-t=${t[0]} class="block w-full text-left px-3 py-1.5 rounded text-sm ${TAB===t[0]?'bg-indigo-600 text-white':'hover:bg-slate-800'}">${t[1]}</button>`).join('')}
 <button id=bell class="block w-full text-left px-3 py-1.5 rounded text-sm hover:bg-slate-800">🔔 Notifications ${n.length?`<span class="bg-red-500 text-white rounded-full px-1.5 text-xs">${n.length}</span>`:''}</button><button id=out class="block w-full text-left px-3 py-1.5 text-sm text-slate-400">Sign out</button></aside><main id=main class="flex-1 p-5 space-y-4"></main></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;shell()});$('#out').onclick=()=>{localStorage.removeItem('t');T=null;loginView()};
 $('#bell').onclick=act(async()=>{const l=await api('/notifications');$('#main').innerHTML='<h2 class="text-xl font-semibold">Notifications</h2>'+table([['When',r=>fd(r.created_at)],['Message',r=>esc(r.message)]],l);await api('/notifications/read',{method:'POST',body:{}})});
 try{await VIEWS[TAB]($('#main'))}catch(e){$('#main').innerHTML=`<p class=text-red-600>${esc(e.message)}</p>`}}
const H=t=>`<h2 class="text-xl font-semibold">${t}</h2>`;
const VIEWS={
async dash(m){const d=await api('/dashboard');const c=(l,v)=>`<div class="bg-white rounded shadow p-4"><div class="text-slate-500 text-sm">${l}</div><div class="text-3xl font-bold">${v}</div></div>`;
 m.innerHTML=H('Dashboard (this month)')+`<div class="grid grid-cols-2 md:grid-cols-5 gap-3">${c('Days present',d.present)}${c('Anomalies',d.anomalies)}${c('Late minutes',d.late)}${c('Overtime min',d.ot)}${c('Pending corrections',d.pendingCorrections)}</div>`},
async att(m){const l=await api('/me/attendance');m.innerHTML=H('My Attendance')+table([['Date',r=>fd(r.day)],['In',r=>ft(r.first_in)],['Out',r=>ft(r.last_out)],['Worked',r=>(r.worked_min/60).toFixed(1)+'h'],['Late',r=>r.late_min||''],['OT',r=>r.overtime_min||''],['Status',r=>r.status],['Issue',r=>r.anomaly?`<span class="text-red-600">${r.anomaly}</span>`:'']],l)},
async corr(m){const l=await api('/corrections');const can=r=>(R()==='manager'&&r.status==='pending_manager')||(isHR()&&r.status==='pending_hr');
 m.innerHTML=H(R()==='employee'?'Attendance corrections':'Approvals')+(R()==='employee'?`<form id=cf class="bg-white p-4 rounded shadow grid md:grid-cols-3 gap-2 items-end"><select name=type class="${inp}"><option value=correction>Attendance correction</option><option value=regularization>Regularization</option></select><label class=text-xs>Date<input name=day type=date required class="${inp} w-full"></label><label class=text-xs>Correct in<input name=new_in type=datetime-local class="${inp} w-full"></label><label class=text-xs>Correct out<input name=new_out type=datetime-local class="${inp} w-full"></label><label class=text-xs>Attachment<input name=attachment type=file class="text-xs w-full"></label><input name=reason required minlength=10 placeholder="Reason (min 10 chars)" class="${inp} md:col-span-4"><button class="${btn}">Submit</button></form>`:'')+
 table([['#',r=>r.id],['Employee',r=>esc(r.full_name)],['Date',r=>fd(r.day)],['In',r=>ft(r.new_in)],['Out',r=>ft(r.new_out)],['Reason',r=>esc(r.reason)],['File',r=>r.attachment_path?`<button data-att="corrections/${r.id}" class="${ghost}">📎</button>`:''],['Status',r=>r.status],['',r=>can(r)?`<button class="${btn}" data-a=1 data-i=${r.id}>Approve</button> <button class="${ghost}" data-a=0 data-i=${r.id}>Reject</button>`:'']],l);
 if($('#cf'))$('#cf').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);for(const k of['new_in','new_out']){if(f.get(k))f.set(k,new Date(f.get(k)).toISOString());else f.delete(k)}if(!f.get('attachment').size)f.delete('attachment');await api('/corrections',{body:f});toast('Submitted');VIEWS.corr(m)});
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=act(async()=>{await api(`/corrections/${b.dataset.i}/decide`,{body:{approve:b.dataset.a==='1'}});VIEWS.corr(m)}))},
async leave(m){const l=await api('/leaves');const can=R()!=='employee';
 m.innerHTML=H('Leaves')+`<form id=lf class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-end"><label class=text-xs>From<input name=f type=date required class="${inp}"></label><label class=text-xs>To<input name=t type=date required class="${inp}"></label><label class=text-sm><input type=checkbox name=paid checked> Paid</label><button class="${btn}">Request</button></form>`+
 table([['Employee',r=>esc(r.full_name)],['From',r=>fd(r.from_date)],['To',r=>fd(r.to_date)],['Paid',r=>r.paid?'Yes':'No'],['Status',r=>r.status],['',r=>can&&r.status==='pending'?`<button class="${btn}" data-a=1 data-i=${r.id}>Approve</button> <button class="${ghost}" data-a=0 data-i=${r.id}>Reject</button>`:'']],l);
 $('#lf').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);await api('/leaves',{body:{from_date:f.get('f'),to_date:f.get('t'),paid:!!f.get('paid')}});VIEWS.leave(m)});
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=act(async()=>{await api(`/leaves/${b.dataset.i}/decide`,{body:{approve:b.dataset.a==='1'}});VIEWS.leave(m)}))},
async anom(m){const l=await api('/attendance/anomalies');m.innerHTML=H('Anomalies & discrepancies')+table([['Employee',r=>esc(r.full_name)],['Date',r=>fd(r.day)],['In',r=>ft(r.first_in)],['Out',r=>ft(r.last_out)],['Issue',r=>`<span class=text-red-600>${r.anomaly}</span>`]],l)},
async import(m){m.innerHTML=H('Import biometric punches')+`<div class="bg-white p-4 rounded shadow space-y-3"><p class=text-sm>CSV columns: <code>device_user_id,timestamp</code></p><input id=file type=file accept=.csv><button id=imp class="${btn}">Import</button><hr><label class=text-sm>Process day <input id=day type=date class="${inp}"></label> <button id=proc class="${btn}">Process</button><pre id=res class="text-xs"></pre></div>`;
 $('#imp').onclick=act(async()=>{const f=new FormData();f.append('file',$('#file').files[0]);$('#res').textContent=JSON.stringify(await api('/punches/import',{body:f}))});
 $('#proc').onclick=act(async()=>{await api('/attendance/process',{body:{day:$('#day').value}});toast('Processed')})},
async pay(m){const ym=window.YM||new Date().toLocaleDateString('en-CA').slice(0,7);const [per,users]=await Promise.all([api('/periods'),api('/users')]);const st=per.find(p=>p.ym===ym)?.status||'open';let rows=[];try{rows=await api('/payroll/'+ym)}catch{}
 m.innerHTML=H('Payroll & period closure')+`<div class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-center"><input id=ym value=${ym} class="${inp} w-28"><span class="px-2 py-0.5 rounded text-xs ${st==='locked'?'bg-red-100 text-red-700':'bg-green-100 text-green-700'}">${st}</span>
 <button id=close class="${btn}">Verify & lock month</button><button id=run class="${btn}">Run payroll</button><button id=xl class="${ghost}">Excel</button><button id=f9 class="${ghost}">Focus 9 CSV</button>${R()==='super_admin'?`<button id=reopen class="${ghost}">Reopen</button>`:''}</div>
 <form id=pf class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-end"><select name=u class="${inp}">${users.filter(u=>u.base_salary>0).map(u=>`<option value=${u.id}>${esc(u.full_name)}</option>`).join('')}</select><select name=k class="${inp}"><option>allowance</option><option>deduction</option></select><input name=a type=number step=0.01 required placeholder=Amount class="${inp}"><input name=n placeholder=Note class="${inp}"><button class="${btn}">Add item</button></form>`+
 table([['Employee',r=>esc(r.full_name)],['Present',r=>r.detail.present],['Unpaid days',r=>r.detail.unpaidDays],['OT min',r=>r.detail.otMin],['Gross',r=>r.gross],['Deductions',r=>r.deductions],['Net',r=>`<b>${r.net}</b>`]],rows);
 const go=f=>act(async()=>{window.YM=$('#ym').value;await f(window.YM);VIEWS.pay(m)});
 $('#ym').onchange=()=>{window.YM=$('#ym').value;VIEWS.pay(m)};$('#close').onclick=go(y=>api(`/periods/${y}/close`,{method:'POST',body:{}}));$('#run').onclick=go(y=>api(`/payroll/${y}/run`,{method:'POST',body:{}}));
 if($('#reopen'))$('#reopen').onclick=go(y=>api(`/periods/${y}/reopen`,{body:{reason:prompt('Reason for reopening (min 10 chars)')||''}}));
 const dl=(p,n)=>act(async()=>{const b=await api(p,{blob:1});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()});$('#xl').onclick=()=>dl(`/payroll/${$('#ym').value}/export.xlsx`,'payroll.xlsx')();$('#f9').onclick=()=>dl(`/payroll/${$('#ym').value}/focus9.csv`,'focus9.csv')();
 $('#pf').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);await api('/payroll-items',{body:{user_id:+f.get('u'),ym:$('#ym').value,kind:f.get('k'),amount:+f.get('a'),note:f.get('n')}});toast('Added');e.target.reset()})},
async users(m){const l=await api('/users');m.innerHTML=H('People')+table([['Name',r=>esc(r.full_name)],['Email',r=>esc(r.email)],['Role',r=>r.role],['Device ID',r=>r.device_user_id||''],['Dept',r=>r.dept||'']],l)},
async audit(m){const [v,l]=await Promise.all([api('/audit/verify'),api('/audit')]);m.innerHTML=H('Immutable audit log')+`<p class="text-sm ${v.intact?'text-green-700':'text-red-700'}">Hash chain ${v.intact?'intact ✔':'BROKEN at #'+v.firstBrokenId}</p>`+table([['#',r=>r.id],['When',r=>new Date(r.at).toLocaleString()],['Actor',r=>r.actor],['Action',r=>r.action],['Entity',r=>r.entity+' '+r.entity_id]],l)}};
const can=r=>(R()==='manager'&&r.status==='pending_manager')||(isHR()&&r.status==='pending_hr');
const dbtn=r=>can(r)?`<button class="${btn}" data-a=1 data-i=${r.id}>Approve</button> <button class="${ghost}" data-a=0 data-i=${r.id}>Reject</button>`:'';
const bindD=(m,base,re)=>m.querySelectorAll('[data-a]').forEach(b=>b.onclick=act(async()=>{const approve=b.dataset.a==='1';const comment=approve?undefined:(prompt('Reason for rejection (optional)')||undefined);await api(`${base}/${b.dataset.i}/decide`,{body:{approve,comment}});re()}));
const dl=(p,n)=>act(async()=>{const b=await api(p,{blob:1});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-att]');if(b)dl('/attachment/'+b.dataset.att,'attachment')()});
const curYM=()=>new Date().toLocaleDateString('en-CA').slice(0,7);
const card=(l,v,x='')=>`<div class="bg-white rounded shadow p-4"><div class="text-slate-500 text-sm">${l}</div><div class="text-2xl font-bold ${x}">${v}</div></div>`;
const chip=s=>`<span class="px-2 py-0.5 rounded text-xs ${s==='locked'?'bg-red-100 text-red-700':s==='pending_authorization'?'bg-amber-100 text-amber-700':'bg-green-100 text-green-700'}">${s.replace('_',' ')}</span>`;
Object.assign(VIEWS,{
async dash(m){const [d,t]=await Promise.all([api('/dashboard'),api('/tasks')]);const todo=t.corrections+t.leaves+t.overtime+t.authorizations;
 m.innerHTML=H('Dashboard (this month)')+`<div class="grid grid-cols-2 md:grid-cols-5 gap-3">${card('Days present',d.present)}${card('Exceptions',d.anomalies)}${card('Late minutes',d.late)}${card('Overtime min',d.ot)}${card('Awaiting my action',todo,todo?'text-amber-600':'')}</div>`+
 (todo?`<div class="bg-amber-50 border border-amber-200 rounded p-3 text-sm">Pending: ${t.corrections} corrections · ${t.leaves} leaves · ${t.overtime} overtime${t.authorizations?` · ${t.authorizations} month(s) to authorize`:''}</div>`:'')},
async leave(m){const l=await api('/leaves');
 m.innerHTML=H('Leave requests')+`<form id=lf class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-end"><label class=text-xs>From<input name=from_date type=date required class="${inp}"></label><label class=text-xs>To<input name=to_date type=date required class="${inp}"></label><select name=paid class="${inp}"><option value=true>Paid</option><option value=false>Unpaid</option></select><input name=reason placeholder=Reason class="${inp}"><input name=attachment type=file class=text-xs><button class="${btn}">Request</button></form>`+
 table([['Employee',r=>esc(r.full_name)],['From',r=>fd(r.from_date)],['To',r=>fd(r.to_date)],['Paid',r=>r.paid?'Yes':'No'],['Reason',r=>esc(r.reason)],['File',r=>r.attachment_path?`<button data-att="leaves/${r.id}" class="${ghost}">📎</button>`:''],['Status',r=>r.status],['',dbtn]],l);
 $('#lf').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('attachment').size)f.delete('attachment');await api('/leaves',{body:f});VIEWS.leave(m)});bindD(m,'/leaves',()=>VIEWS.leave(m))},
async ot(m){const l=await api('/overtime');
 m.innerHTML=H('Overtime requests')+`<form id=of class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-end"><label class=text-xs>Date<input name=day type=date required class="${inp}"></label><label class=text-xs>Minutes<input name=minutes type=number min=15 max=720 required class="${inp} w-24"></label><input name=reason required minlength=10 placeholder="Reason (min 10 chars)" class="${inp}"><input name=attachment type=file class=text-xs><button class="${btn}">Request</button></form>`+
 table([['Employee',r=>esc(r.full_name)],['Date',r=>fd(r.day)],['Minutes',r=>r.minutes],['Reason',r=>esc(r.reason)],['File',r=>r.attachment_path?`<button data-att="overtime_requests/${r.id}" class="${ghost}">📎</button>`:''],['Status',r=>r.status],['',dbtn]],l);
 $('#of').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('attachment').size)f.delete('attachment');await api('/overtime',{body:f});VIEWS.ot(m)});bindD(m,'/overtime',()=>VIEWS.ot(m))},
async analytics(m){const ym=window.AM||curYM();const a=await api('/analytics?ym='+ym),k=a.kpi;
 m.innerHTML=H('Analytics')+`<div class="flex gap-2 items-center"><input id=am type=month value=${ym} class="${inp}"> ${chip(k.closure)}<button id=pdf class="${ghost}">Attendance PDF</button><button id=xls class="${ghost}">Excel</button></div>
 <div class="grid grid-cols-2 md:grid-cols-6 gap-3">${card('Staff tracked',k.staff)}${card('Attendance rate',k.attendanceRate+'%')}${card('Absenteeism',k.absenteeism+'%',k.absenteeism>10?'text-red-600':'')}${card('Overtime hours',k.overtimeHours)}${card('Exceptions',k.exceptions)}${card('Pending approvals',k.pendingApprovals,k.pendingApprovals?'text-amber-600':'')}</div>`+
 `<h3 class="font-semibold">By department</h3>`+table([['Department',r=>esc(r.dept)],['Staff',r=>r.staff],['Present days',r=>r.present],['Absent days',r=>r.absent],['Late min',r=>r.late_min],['OT min',r=>r.ot_min],['Exceptions',r=>r.exceptions]],a.departments)+
 `<h3 class="font-semibold">Daily attendance</h3><div class="bg-white rounded shadow p-3 space-y-1">${a.daily.map(d=>{const t=+d.present+ +d.absent;return `<div class="flex items-center gap-2 text-xs"><span class=w-20>${fd(d.day)}</span><div class="bg-indigo-500 h-3 rounded" style="width:${Math.round(d.present/Math.max(1,t)*60)}%"></div><span>${d.present}/${t}</span></div>`}).join('')||'<span class=text-slate-400>No data</span>'}</div>`;
 $('#am').onchange=()=>{window.AM=$('#am').value;VIEWS.analytics(m)};$('#pdf').onclick=()=>dl(`/reports/monthly/${ym}/attendance.pdf`,`attendance_${ym}.pdf`)();$('#xls').onclick=()=>dl(`/reports/monthly/${ym}/attendance.xlsx`,`attendance_${ym}.xlsx`)()},
async pay(m){const ym=window.YM||curYM(),r=R(),PO=['payroll_officer','super_admin'].includes(r);const [per,us]=await Promise.all([api('/periods'),api('/users')]);const st=per.find(p=>p.ym===ym)?.status||'open';let rows=[];try{rows=await api('/payroll/'+ym)}catch{}
 m.innerHTML=H('Month closure & payroll preparation')+`<div class="bg-white p-4 rounded shadow flex flex-wrap gap-2 items-center"><input id=ym type=month value=${ym} class="${inp}">${chip(st)}
 ${isHR()&&st==='open'?`<button id=close class="${btn}">${r==='super_admin'?'Verify & lock month':'Submit month for authorization'}</button>`:''}${r==='super_admin'&&st==='pending_authorization'?`<button id=auth class="${btn}">Authorize & lock</button>`:''}${r==='super_admin'&&st!=='open'?`<button id=reopen class="${ghost}">Reopen</button>`:''}${PO?`<button id=run class="${btn}">Run payroll summary</button>`:''}
 <button id=xl class="${ghost}">Payroll Excel</button><button id=ps class="${ghost}">Payroll PDF</button>${PO?`<button id=f9 class="${ghost}">Focus 9 CSV</button>`:''}<button id=ap class="${ghost}">Attendance PDF</button></div>`+

 table([['Employee',x=>esc(x.full_name)],['Payable days',x=>x.payable_days],['Unpaid days',x=>x.unpaid_days],['Approved OT (h)',x=>(x.ot_minutes/60).toFixed(1)],['Allowances',x=>x.allowances],['Deductions',x=>x.deductions],['Net',x=>x.net??'—'],['Flags',x=>x.detail?.unresolvedMissingPunch?`<span class=text-red-600>${x.detail.unresolvedMissingPunch} unresolved punch(es)</span>`:'']],rows);

 on('#reopen',go(y=>api(`/periods/${y}/reopen`,{body:{reason:prompt('Reason for reopening (min 10 chars)')||''}}),'Month reopened'));on('#run',go(y=>api(`/payroll/${y}/run`,{body:{}}),'Payroll summary generated'));
 on('#xl',()=>dl(`/payroll/${$('#ym').value}/export.xlsx`,'payroll.xlsx')());on('#ps',()=>dl(`/payroll/${$('#ym').value}/summary.pdf`,'payroll.pdf')());on('#f9',()=>dl(`/payroll/${$('#ym').value}/focus9.csv`,'focus9.csv')());on('#ap',()=>dl(`/reports/monthly/${$('#ym').value}/attendance.pdf`,'attendance.pdf')());
 if($('#pf'))$('#pf').onsubmit=act(async e=>{e.preventDefault();const f=new FormData(e.target);await api('/payroll-items',{body:{user_id:+f.get('u'),ym:$('#ym').value,kind:f.get('k'),amount:+f.get('a'),note:f.get('n')}});toast('Added');e.target.reset()})},
async users(m){const l=await api('/users'),sal=l.some(u=>u.base_salary!=null),SO=['payroll_officer','super_admin'].includes(R()),stOpt=['active','probation','on_leave','terminated'];
 m.innerHTML=H(R()==='manager'?'My team':'People')+table([['Name',u=>esc(u.full_name)],['Email',u=>esc(u.email)],['Role',u=>u.role],['Dept',u=>esc(u.dept||'')],['Designation',u=>esc(u.designation||'')],['Device ID',u=>u.device_user_id||''],
  ['Status',u=>isHR()?`<select data-u=${u.id} class="${inp}">${stOpt.map(s=>`<option ${s===u.status?'selected':''}>${s}</option>`).join('')}</select>`:u.status],
  ...(sal||SO?[['Base salary',u=>SO?`${u.base_salary??'—'} <button data-s=${u.id} class="${ghost}">Set</button>`:'']]:[])],l);
 m.querySelectorAll('[data-u]').forEach(s=>s.onchange=act(async()=>{await api('/users/'+s.dataset.u,{method:'PATCH',body:{status:s.value}});toast('Status updated')}));
 m.querySelectorAll('[data-s]').forEach(b=>b.onclick=act(async()=>{const v=prompt('Base salary');if(v===null)return;await api('/users/'+b.dataset.s,{method:'PATCH',body:{base_salary:+v}});VIEWS.users(m)}))},
async setup(m){const [mt,us]=await Promise.all([api('/meta'),api('/users')]);const opt=(a,k='name')=>`<option value="">—</option>`+a.map(x=>`<option value=${x.id}>${esc(x[k])}</option>`).join('');
 const mini=(id,ph,extra='')=>`<form id=${id} class="bg-white p-3 rounded shadow flex gap-2">${extra}<input name=name required placeholder="${ph}" class="${inp} flex-1"><button class="${btn}">Add</button></form>`;
 m.innerHTML=H('Organisation setup')+`<form id=uf class="bg-white p-4 rounded shadow grid md:grid-cols-4 gap-2 text-sm"><b class="md:col-span-4">Add employee</b><input name=full_name required placeholder="Full name" class="${inp}"><input name=email type=email required placeholder=Email class="${inp}"><input name=password type=password required minlength=10 placeholder="Temp password (10+ chars)" class="${inp}"><input name=device_user_id placeholder="Biometric device ID" class="${inp}">
 <select name=role class="${inp}">${(R()==='super_admin'?['employee','manager','hr','payroll_officer','it_admin','super_admin']:['employee','manager']).map(x=>`<option>${x}</option>`).join('')}</select><select name=dept_id class="${inp}">${opt(mt.departments)}</select><select name=designation_id class="${inp}">${opt(mt.designations)}</select><select name=manager_id class="${inp}">${opt(us.filter(u=>u.role==='manager'),'full_name')}</select><input name=join_date type=date class="${inp}"><button class="${btn}">Add</button></form>
 <div class="grid md:grid-cols-3 gap-3">${mini('df','New department')}${mini('gf','New designation')}<form id=hf class="bg-white p-3 rounded shadow flex gap-2"><input name=day type=date required class="${inp}"><input name=name required placeholder="Holiday" class="${inp} flex-1"><button class="${btn}">Add</button></form></div>
 <div class="bg-white p-3 rounded shadow text-sm">Weekly off days (0=Sun … 6=Sat, comma-separated): <input id=wo value="${mt.weekly_off}" class="${inp} w-24"> <button id=wob class="${ghost}">Save</button></div>`+
 table([['Holiday',h=>fd(h.day)],['Name',h=>esc(h.name)],['',h=>`<button data-h=${fd(h.day)} class="${ghost}">Remove</button>`]],mt.holidays);
 const post=(id,path,map)=>$(id).onsubmit=act(async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await api(path,{body:map?map(f):f});toast('Saved');VIEWS.setup(m)});
 const n=v=>v?+v:undefined;post('#uf','/users',f=>({...f,dept_id:n(f.dept_id),designation_id:n(f.designation_id),manager_id:n(f.manager_id),device_user_id:f.device_user_id||undefined,join_date:f.join_date||undefined}));post('#df','/departments');post('#gf','/designations');post('#hf','/holidays');
 $('#wob').onclick=act(async()=>{await api('/settings/weekly_off',{method:'PUT',body:{value:$('#wo').value}});toast('Saved')});m.querySelectorAll('[data-h]').forEach(b=>b.onclick=act(async()=>{await api('/holidays/'+b.dataset.h,{method:'DELETE'});VIEWS.setup(m)}))}
});

T?boot():loginView();
